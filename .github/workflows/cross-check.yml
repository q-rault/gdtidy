# Temporary: checks the Intel macOS cross-build before merging. Removed before merge.
name: cross-check
on: pull_request
jobs:
  intel-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin --locked -p gdtidy
      - run: |
          file target/x86_64-apple-darwin/release/gdtidy
          file target/x86_64-apple-darwin/release/gdtidy | grep -q x86_64
          arch -x86_64 target/x86_64-apple-darwin/release/gdtidy --version
