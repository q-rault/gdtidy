[workspace]
resolver = "2"
members = [
    "crates/gdtidy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/q-rault/gdtidy"
homepage = "https://github.com/q-rault/gdtidy"
authors = ["Quentin Rault"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"

# Lives in its own repository, checked out next to this one until it is on
# crates.io. Publishing gdtidy drops the path and uses the version.
gdsyntax = { path = "../gdsyntax", version = "0.1.3" }

[profile.release]
lto = "thin"
codegen-units = 1
