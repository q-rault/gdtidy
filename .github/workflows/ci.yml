name: ci

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: gdtidy
    steps:
      # gdtidy builds against gdsyntax checked out next to it, as locally.
      - uses: actions/checkout@v5
        with:
          path: gdtidy
      - uses: actions/checkout@v5
        with:
          repository: q-rault/gdsyntax
          path: gdsyntax
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gdtidy/target
          key: ${{ runner.os }}-v3-cargo-${{ hashFiles('gdtidy/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # In its own folder: packaging points the build tracking in target/ at the
      # packaged sources, and the cache would then keep later builds stale.
      # The packaged crate uses gdsyntax from crates.io, not the checkout.
      - run: cargo package --workspace --locked --target-dir "${{ runner.temp }}/package"
