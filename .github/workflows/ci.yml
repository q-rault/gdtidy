name: ci

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the run of the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-v4-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # In its own folder: packaging points the build tracking in target/ at the
      # packaged sources, and the cache would then keep later builds stale.
      - if: runner.os == 'Linux'  # the packaged contents do not depend on the OS
        run: cargo package --workspace --locked --target-dir "${{ runner.temp }}/package"
