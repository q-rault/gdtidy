[workspace]
resolver = "2"
members = [
    "crates/gdtidy",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/q-rault/gdtidy"
homepage = "https://github.com/q-rault/gdtidy"
authors = ["Quentin Rault"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.6"
toml = "0.8"
walkdir = "2.5"
yaml-rust2 = "0.10"

# From crates.io. To try unreleased gdsyntax changes, add to
# .cargo/config.toml: [patch.crates-io] gdsyntax = { path = "../gdsyntax" }
gdsyntax = "0.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
