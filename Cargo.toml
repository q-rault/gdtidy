[workspace]
resolver = "2"
members = [
    "crates/gdsyntax",
    "crates/gdtidy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/q-rault/gdtidy"
homepage = "https://github.com/q-rault/gdtidy"
authors = ["Quentin Rault"]

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rowan = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"

gdsyntax = { path = "crates/gdsyntax", version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
